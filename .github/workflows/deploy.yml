name: Deploy to GitHub Pages

on:
  # Runs on every push to main and can be triggered manually.
  push:
    branches: [main]
  workflow_dispatch:

# Allow the job to clone the repo and publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install, build, and upload your site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6
        # with:
        #   path: . # Root of the Astro project inside the repo (optional).
        #   node-version: 24 # Defaults to 24 (optional).
        #   package-manager: npm@latest # Detected from the lockfile (optional).

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
